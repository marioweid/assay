name: Container publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v (for example, 1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      tags: ${{ steps.release.outputs.tags }}
      labels: ${{ steps.release.outputs.labels }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        name: Validate version and image tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version=$INPUT_VERSION
          else
            version=${GITHUB_REF_NAME#v}
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "version must be a semantic version without build metadata: $version" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "release tag must exactly match v$version" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          created=$(git show -s --format=%cI)
          tags="$image:$version"$'\n'"$image:sha-$GITHUB_SHA"
          if [[ "$version" != *-* ]]; then
            tags+=$'\n'"$image:latest"
          fi
          labels=$(printf '%s\n' \
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "org.opencontainers.image.revision=$GITHUB_SHA" \
            "org.opencontainers.image.version=$version" \
            "org.opencontainers.image.created=$created")
          {
            printf 'image=%s\n' "$image"
            printf 'version=%s\n' "$version"
            printf 'created=%s\n' "$created"
            printf 'tags<<EOF\n%s\nEOF\n' "$tags"
            printf 'labels<<EOF\n%s\nEOF\n' "$labels"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build and smoke test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke test linux/amd64
        shell: bash
        run: |
          set -euo pipefail
          image="assay-container-ci:${GITHUB_SHA}"
          docker buildx build --load --platform linux/amd64 --tag "$image" \
            --build-arg "VERSION=${{ needs.prepare.outputs.version }}" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "CREATED=${{ needs.prepare.outputs.created }}" \
            --file assayd/Dockerfile .
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = \
            "${{ needs.prepare.outputs.version }}"
          tests/acceptance/container-smoke.sh "$image"
      - name: Build and smoke test linux/arm64
        shell: bash
        run: |
          set -euo pipefail
          image="assay-container-ci-arm64:${GITHUB_SHA}"
          docker buildx build --load --platform linux/arm64 --tag "$image" \
            --build-arg "VERSION=${{ needs.prepare.outputs.version }}" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "CREATED=${{ needs.prepare.outputs.created }}" \
            --file assayd/Dockerfile .
          tests/acceptance/container-smoke.sh "$image"

  publish:
    name: Publish verified release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://${{ needs.prepare.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a release version
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "release image already exists: $image" >&2
            exit 1
          fi
      - id: image
        name: Publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: assayd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.prepare.outputs.created }}
          sbom: true
          provenance: mode=max
      - name: Verify published manifest and anonymous pull
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.prepare.outputs.image }}@${{ steps.image.outputs.digest }}"
          docker buildx imagetools inspect "$image" --raw >manifest.json
          python3 - <<'PY'
          import json

          with open("manifest.json") as file:
              platforms = [item.get("platform", {}) for item in json.load(file)["manifests"]]
          architectures = {platform["architecture"] for platform in platforms if platform.get("os") == "linux"}
          assert architectures == {"amd64", "arm64"}, architectures
          PY
          config=$(mktemp -d)
          trap 'rmdir "$config"' EXIT
          DOCKER_CONFIG="$config" docker pull "$image"
          docker image tag "$image" "assay-container-published:${GITHUB_SHA}"
          tests/acceptance/container-smoke.sh "assay-container-published:${GITHUB_SHA}"
